name: Apply SPA ad rescan fix

on:
  push:
    branches:
      - fix/spa-ad-rescan

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spa-ad-rescan
          fetch-depth: 0

      - name: Apply lifecycle fix
        run: python scripts/apply-spa-ad-rescan-fix.py

      - name: Verify unit tests and builds
        run: |
          npm ci
          npm run test:coverage
          npm run build
          npm run build:edge-android

      - name: Commit fix when changed
        run: |
          if git diff --quiet -- src/content.js; then
            echo "No production change to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/content.js
          git commit -m "fix: rescan ads across SPA navigation"
          git push origin HEAD:fix/spa-ad-rescan
