name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with 100% coverage gate
        run: npm run test:coverage

      - name: Build extension
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run installed-extension E2E tests
        run: npm run test:e2e

      - name: Upload popup screenshots and Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-ui-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
