name: Apply v1.0.12 npm metadata once

on:
  push:
    branches:
      - fix/restore-release-version-sequence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-release-version-sequence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize npm release metadata
        run: npm version 1.0.12 --no-git-tag-version
      - name: Verify synchronized metadata
        run: |
          node -e "const p=require('./package.json'), l=require('./package-lock.json'); if(p.version!=='1.0.12'||l.version!=='1.0.12'||l.packages[''].version!=='1.0.12') process.exit(1)"
      - name: Commit npm release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: align npm release metadata to v1.0.12"
          git push origin HEAD:fix/restore-release-version-sequence
