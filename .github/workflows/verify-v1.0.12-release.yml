name: Verify v1.0.12 release once

on:
  push:
    branches:
      - fix/restore-release-version-sequence

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-release-version-sequence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate v1.0.12 release metadata
        run: npm run release:validate -- "v1.0.12"
      - name: Build extension
        run: npm run build
      - name: Inspect release package contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./dist/manifest.json');
          const packageJson = require('./package.json');
          const packageLock = require('./package-lock.json');
          if (manifest.version !== '1.0.12') throw new Error(`manifest=${manifest.version}`);
          if (packageJson.version !== '1.0.12') throw new Error(`package=${packageJson.version}`);
          if (packageLock.version !== '1.0.12' || packageLock.packages[''].version !== '1.0.12') throw new Error('lockfile version mismatch');
          if (JSON.stringify(manifest.host_permissions) !== JSON.stringify(['https://raw.githubusercontent.com/*'])) throw new Error('required hosts changed');
          if (JSON.stringify(manifest.optional_host_permissions) !== JSON.stringify(['http://*/*','https://*/*'])) throw new Error('optional hosts changed');
          if ('content_scripts' in manifest) throw new Error('static content_scripts returned');
          for (const file of [
            'dist/runtime/content.js',
            'dist/runtime/inject.js',
            'dist/wasm/ort-wasm.wasm',
            'dist/wasm/ort-wasm-simd.wasm',
            'dist/wasm/ort-wasm-threaded.wasm',
            'dist/wasm/ort-wasm-simd-threaded.wasm',
          ]) {
            const stat = fs.statSync(file);
            if (stat.size <= 0) throw new Error(`empty artifact: ${file}`);
            console.log(`${file}: ${stat.size} bytes`);
          }
          console.log(JSON.stringify({ version: manifest.version, host_permissions: manifest.host_permissions, optional_host_permissions: manifest.optional_host_permissions }, null, 2));
          NODE
