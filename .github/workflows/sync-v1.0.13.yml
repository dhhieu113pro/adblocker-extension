name: Sync v1.0.13 lockfile

on:
  push:
    branches:
      - chore/v1.0.13

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v1.0.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync package-lock version
        run: npm version 1.0.13 --no-git-tag-version --allow-same-version
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Version metadata already synchronized"
          else
            git commit -m "chore: sync lockfile for 1.0.13"
            git push origin HEAD:chore/v1.0.13
          fi
