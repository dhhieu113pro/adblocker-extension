name: Apply in-flight bypass fix once

on:
  push:
    branches:
      - fix/true-protection-bypass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/true-protection-bypass
      - name: Apply in-flight bypass fix
        run: python scripts/apply-inflight-bypass-fix.py
      - name: Commit production change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content.js
          git diff --cached --quiet && { echo "::error::No production change was produced"; exit 1; }
          git commit -m "fix: invalidate in-flight ad checks on bypass"
          git push origin HEAD:fix/true-protection-bypass
