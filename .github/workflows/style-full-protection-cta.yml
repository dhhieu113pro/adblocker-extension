name: Style full protection CTA

on:
  push:
    branches:
      - feat/optional-site-access

permissions:
  contents: write

jobs:
  style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-site-access
      - name: Add CTA styling
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/popup.css")
          css = path.read_text()
          marker = ".primary-button {"
          if marker not in css:
              css += """

          .primary-button {
            align-self: flex-start;
            min-height: 36px;
            margin-top: var(--space-xs);
            padding: 0 var(--space-sm);
            border: 1px solid var(--color-accent);
            border-radius: var(--radius-sm);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
          }

          .primary-button:disabled {
            cursor: wait;
            opacity: 0.6;
          }

          .primary-button:active {
            transform: translateY(1px);
          }

          @media (hover: hover) {
            .primary-button:hover:not(:disabled) {
              filter: brightness(1.08);
            }
          }
          """
              path.write_text(css)
      - name: Commit style
        run: |
          if git diff --quiet -- src/popup.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/popup.css
          git commit -m "style: add full protection action"
          git push origin HEAD:feat/optional-site-access
