name: Create v0.1.14 tag once

on:
  push:
    branches:
      - feat/optional-site-access

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main merge commit
        uses: actions/checkout@v4
        with:
          ref: 682bf051895fd3932c8b2fdf463f23449625aa55
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "682bf051895fd3932c8b2fdf463f23449625aa55"
          test "$(node -p "require('./src/manifest.json').version")" = "0.1.14"
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.14 >/dev/null 2>&1; then
            echo "::error::Tag v0.1.14 already exists"
            exit 1
          fi

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag v0.1.14 682bf051895fd3932c8b2fdf463f23449625aa55
          git push origin refs/tags/v0.1.14
