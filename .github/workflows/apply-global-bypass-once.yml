name: Apply global bypass once

on:
  push:
    branches:
      - fix/true-protection-bypass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/true-protection-bypass
      - name: Apply tested global bypass patch
        run: python scripts/apply-global-bypass.py
      - name: Commit production changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background.ts src/content.js
          git diff --cached --quiet && { echo "::error::No production changes were produced"; exit 1; }
          git commit -m "fix: honor global protection bypass"
          git push origin HEAD:fix/true-protection-bypass
