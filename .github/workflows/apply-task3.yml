name: Apply Task 3 patch

on:
  push:
    branches:
      - feat/optional-site-access

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-site-access
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lifecycle patch
        run: node scripts/task3-optional-access-patch.mjs
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background.ts src/content.js src/inject.ts
          git commit -m "feat: sync full protection with optional access"
          git push origin HEAD:feat/optional-site-access
