name: Sync main release alignment

on:
  push:
    branches:
      - feat/optional-site-access

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-site-access
      - name: Carry forward classifier wording from main
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/background.ts';
          let source = fs.readFileSync(path, 'utf8');
          const oldMethod = '"MobileNetV4 Image Classification + Heuristics"';
          const newMethod = '"Fast Local Classifier + Heuristics"';
          const oldComment = '// Whole-page zero-shot classification is a CLIP-only feature. MobileNet\n      // remains image-only and uses URL/domain heuristics for page categories.';
          const newComment = '// Whole-page zero-shot classification is a CLIP-only feature. The fast\n      // local classifier remains image-only and uses URL/domain heuristics for page categories.';
          if (!source.includes(oldMethod)) throw new Error('Expected old classifier label was not found');
          source = source.replace(oldMethod, newMethod);
          if (source.includes(oldComment)) source = source.replace(oldComment, newComment);
          if (!source.endsWith('\n')) source += '\n';
          fs.writeFileSync(path, source);
          NODE
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: carry forward main classifier wording"
          git push origin HEAD:feat/optional-site-access
