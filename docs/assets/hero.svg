<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">AI Vision Ad Blocker</title><desc id="desc">Privacy-first Chromium ad blocker powered by heuristics, local AI vision, and network-level blocking.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2840"/></linearGradient><linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27a2ff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><rect width="1200" height="630" rx="36" fill="url(#bg)"/><circle cx="1020" cy="110" r="210" fill="#27a2ff" opacity=".08"/><circle cx="105" cy="570" r="230" fill="#2dd4bf" opacity=".06"/><g transform="translate(90 105)"><path d="M145 0 270 44v106c0 96-55 169-125 206C75 319 20 246 20 150V44L145 0Z" fill="url(#shield)"/><path d="m88 171 38 38 78-91" fill="none" stroke="#07111f" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Segoe UI,Arial,sans-serif"><text x="430" y="190" fill="#8fd4ff" font-size="28" font-weight="700" letter-spacing="3">AI VISION AD BLOCKER</text><text x="430" y="270" fill="#ffffff" font-size="56" font-weight="750">Block ads smarter.</text><text x="430" y="335" fill="#ffffff" font-size="56" font-weight="750">Keep browsing private.</text><text x="430" y="405" fill="#b8c8da" font-size="28">Heuristics + local CLIP vision + network blocking</text><g transform="translate(430 462)"><rect width="205" height="56" rx="28" fill="#14334a" stroke="#2d668d"/><text x="102" y="36" text-anchor="middle" fill="#dff4ff" font-size="22">100% local AI</text><rect x="225" width="250" height="56" rx="28" fill="#14334a" stroke="#2d668d"/><text x="350" y="36" text-anchor="middle" fill="#dff4ff" font-size="22">Chromium browsers</text></g></g></svg>