name: Apply pre-load scan fix

on:
  push:
    branches:
      - fix/instant-cached-ad-blocking

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-cached-ad-blocking
      - name: Move candidate preflight before image load
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/content.js')
          source = path.read_text()
          old = '''      if (img.complete) checkAndProcess();
                else img.addEventListener("load", checkAndProcess, { once: true });'''
          new = '''      // Use src + declared dimensions immediately so known ads can be hidden
                // before their pixels finish loading. Retry after load only when the early
                // pass did not identify this image as a candidate.
                checkAndProcess();
                if (!img.complete && !this.processedImages.has(img)) {
                  img.addEventListener("load", checkAndProcess, { once: true });
                }'''
          if old not in source:
              raise SystemExit('scanImages load gate pattern not found')
          path.write_text(source.replace(old, new, 1))
      - name: Run unit coverage
        run: npm ci && npm run test:coverage
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content.js
          git commit -m "fix: preflight ads before image load"
          git push origin HEAD:fix/instant-cached-ad-blocking
