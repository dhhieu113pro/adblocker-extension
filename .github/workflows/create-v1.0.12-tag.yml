name: Create v1.0.12 tag once

on:
  push:
    branches:
      - fix/restore-release-version-sequence

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main merge commit
        uses: actions/checkout@v4
        with:
          ref: c5930a2af866147aa89eac0831d63ba68a3239ad
          fetch-depth: 0
      - name: Verify release target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c5930a2af866147aa89eac0831d63ba68a3239ad"
          test "$(node -p "require('./src/manifest.json').version")" = "1.0.12"
          test "$(node -p "require('./package.json').version")" = "1.0.12"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.12 >/dev/null 2>&1; then
            echo "::error::Tag v1.0.12 already exists"
            exit 1
          fi
      - name: Create release tag
        run: |
          set -euo pipefail
          git tag v1.0.12 c5930a2af866147aa89eac0831d63ba68a3239ad
          git push origin refs/tags/v1.0.12
