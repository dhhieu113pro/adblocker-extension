name: Sync Release Lock Metadata

on:
  push:
    branches:
      - docs/unified-chromium-release
    paths:
      - package.json
      - .github/workflows/sync-release-lock.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: docs/unified-chromium-release
          fetch-depth: 0

      - name: Sync package-lock root version metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (!lock.packages || !lock.packages['']) {
            throw new Error('package-lock.json is missing packages[""]');
          }
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit synchronized lock metadata
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock version"
          git push origin HEAD:docs/unified-chromium-release
