<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Vision Ad Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="header-title">
        <span class="logo-icon">🛡️</span>
        <h1>AI Vision Ad Blocker</h1>
      </div>
      <span class="version">v1.0.7</span>
    </header>

    <div id="ai-category-badge" style="display: none; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); background: var(--bg-secondary); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 2px;">
      <span>🎨 AI Category:</span>
      <strong id="ai-category-text" style="color: var(--accent-color); font-weight: 700;">General Site</strong>
    </div>

    <div class="tab-content active" id="tab-adblocker">
      <div class="settings-card">
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-title">Auto-Hide Ads</span>
            <span class="setting-desc">Automatically detect & hide banners & iframes on load</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="auto-hide-toggle" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="detected-ads-section">
        <div class="section-header">
          <h3>Detected Ads on Page</h3>
          <span class="ad-count-badge" id="ad-count-badge">0</span>
        </div>
        <div class="ad-list" id="ad-list">
          <div class="empty-state" id="empty-ads-state">
            <span>✨</span>
            <p>No ads detected on this tab yet</p>
          </div>
        </div>
      </div>

      <div class="detected-ads-section" style="margin-top: 16px; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <div class="section-header">
          <h3>Blocked Ads History</h3>
          <button id="clear-history-btn" style="background: none; border: none; color: var(--danger-color); font-size: 11px; cursor: pointer; padding: 2px 6px;">Clear History</button>
        </div>
        <div class="ad-list" id="history-list" style="max-height: 180px;">
          <div class="empty-state" id="empty-history-state">
            <span>📜</span>
            <p>No history recorded yet</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.ts" type="module"></script>
</body>
</html>
